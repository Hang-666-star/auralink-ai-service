name: Release R25 Guide and Critic

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r25-ai-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release
          test "$GITHUB_REPOSITORY" = bailangguihun/auralink-ai-service
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            guide_service/requirements.txt
            critic-service/requirements.txt
      - name: Verify candidate integrity checks
        run: python -m unittest discover -s tests -p test_ai_release_candidate.py -v
      - name: Install and validate exact release service contracts
        run: |
          python -m pip install -r guide_service/requirements.txt -r critic-service/requirements.txt
          python -m pytest -q tests
      - name: Create and independently verify source candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ai_release_candidate.py create --source . --output dist/r25-ai \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python scripts/ai_release_candidate.py verify \
            --manifest dist/r25-ai/ai-release-candidate.json --archive dist/r25-ai/ai-source.zip \
            --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain candidate for the R25 publication controller
        uses: actions/upload-artifact@v4
        with:
          name: r25-ai-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/r25-ai/ai-release-candidate.json
            dist/r25-ai/ai-source.zip
          if-no-files-found: error
      - name: Record the verified candidate boundary
        run: echo 'Candidate verified; production publication requires the enabled deployment job.' >> "$GITHUB_STEP_SUMMARY"

  deployment-disabled:
    needs: candidate
    if: vars.R25_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record production not deployed
        run: |
          echo '## NOT_DEPLOYED' >> "$GITHUB_STEP_SUMMARY"
          echo 'The Guide/Critic candidate was retained. R25_DEPLOY_ENABLED is not true; no server connection or publication occurred.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: candidate
    if: vars.R25_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the exact candidate from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: r25-ai-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate

      - name: Transfer candidate and invoke the preinstalled trusted controller
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/release ]]
          [[ "$GITHUB_REPOSITORY" == bailangguihun/auralink-ai-service ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          latest="$(git ls-remote --exit-code https://github.com/bailangguihun/auralink-ai-service.git refs/heads/release | cut -f1)"
          [[ "$latest" == "$GITHUB_SHA" ]] || { echo 'Refusing an obsolete queued release.' >&2; exit 1; }
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$SERVER_PORT >= 1 && 10#$SERVER_PORT <= 65535 ))
          [[ "$SERVER_USER" == root ]]
          [[ "$SERVER_HOST_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]]
          [[ -n "$SERVER_SSH_KEY" ]]
          private_dir="$(mktemp -d)"
          chmod 700 "$private_dir"
          trap 'rm -f "$private_dir/key" "$private_dir/known_hosts"; rmdir "$private_dir"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$private_dir/key"
          chmod 600 "$private_dir/key"
          host_alias="[$SERVER_HOST]:$SERVER_PORT"
          if [[ "$SERVER_PORT" == 22 ]]; then host_alias="$SERVER_HOST"; fi
          printf '%s %s\n' "$host_alias" "$SERVER_HOST_KEY" > "$private_dir/known_hosts"
          chmod 600 "$private_dir/known_hosts"
          options=(-i "$private_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$private_dir/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          controller=/root/autodl-tmp/artlive-r25-native-pg16/handoff-production-20260923T062101Z/operations/r25-publisher/ai_publish.py
          incoming="/root/autodl-tmp/artlive-r25-native-pg16/ai-release-incoming/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          identity="--commit $GITHUB_SHA --run-id $GITHUB_RUN_ID --run-attempt $GITHUB_RUN_ATTEMPT"
          ssh "${options[@]}" -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "umask 077; /root/miniconda3/bin/python3 -B '$controller' prepare-incoming $identity"
          scp "${options[@]}" -P "$SERVER_PORT" candidate/ai-release-candidate.json candidate/ai-source.zip \
            "$SERVER_USER@$SERVER_HOST:$incoming/"
          latest="$(git ls-remote --exit-code https://github.com/bailangguihun/auralink-ai-service.git refs/heads/release | cut -f1)"
          [[ "$latest" == "$GITHUB_SHA" ]] || { echo 'Release changed during candidate transfer; publication refused.' >&2; exit 1; }
          ssh "${options[@]}" -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "chmod 600 '$incoming/ai-release-candidate.json' '$incoming/ai-source.zip'; timeout --signal=TERM --kill-after=60 480 /root/miniconda3/bin/python3 -B '$controller' publish $identity"
          echo 'AI controller publication completed. Consult its outcome: AI_SOURCE_PUBLISHED or AI_IDENTICAL_SOURCE_REGISTERED.' >> "$GITHUB_STEP_SUMMARY"
